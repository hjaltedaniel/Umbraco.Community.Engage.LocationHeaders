name: Release Package

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example 0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  publish:
    needs: validate
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack tagged version
        run: dotnet pack src/Umbraco.Community.Engage.LocationHeaders.csproj --configuration Release --output artifacts/packages -p:GeneratePackageOnBuild=false -p:PackageVersion=$env:RELEASE_VERSION
      - name: Authenticate to NuGet with Trusted Publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: hjaltedaniel
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/Umbraco.Community.Engage.LocationHeaders.${env:RELEASE_VERSION}.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
